<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriHatid - User Profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
    }
    .profile-container { 
      display: flex; 
      flex-direction: column; 
      width: 100vw; 
      height: 100vh; 
      margin: 0; 
      background: #fff; 
      box-sizing: border-box; 
    }
    .profile-header { 
      display: flex; 
      align-items: center; 
      padding: 16px; 
      border-bottom: 1px solid #eee; 
      background: #214329; 
      color: white; 
    }
    .profile-header a { 
      color: white; 
      text-decoration: none; 
      font-size: 20px; 
      margin-right: 16px; 
    }
    .profile-content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f9f9f9;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .profile-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
      margin-top: 20px;
    }
    .profile-avatar-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #ccc;
      margin: 0 auto 16px auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #555;
    }
    .profile-name {
      font-size: 20px;
      font-weight: 700;
      color: #1d1d1f;
      margin-bottom: 6px;
    }
    .profile-role {
      font-size: 14px;
      color: #666;
      text-transform: capitalize;
      margin-bottom: 20px;
    }
    .info-box {
      background: #f9f9f9;
      padding: 14px;
      border-radius: 12px;
      text-align: left;
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
    }
    .tricycle-preview-box {
      margin-top: 15px;
      text-align: left;
    }
    .tricycle-img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 8px;
      border: 1px solid #ddd;
    }
    .review-item {
    background: #f9f9f9;
    padding: 12px;
    border-radius: 12px;
    text-align: left;
    margin-bottom: 10px;
    font-size: 13px;
    border: 1px solid #eee;
  }
  .review-stars {
    color: #f1c40f;
    font-size: 14px;
    margin-bottom: 4px;
  }
  </style>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <a href="#" id="back-btn">←</a>
      <h2 style="font-size: 18px; margin:0;">User Profile</h2>
    </div>

    <div class="profile-content">
  <div class="profile-card">
    <div id="avatar-container" class="profile-avatar-large">?</div>
    <h2 id="profile-name" class="profile-name">Loading...</h2>
    <p id="profile-role" class="profile-role">User</p>

    <!-- Phone Number Box -->
    <div class="info-box">
      <div style="font-size: 12px; color: #888;">Phone Number</div>
      <div id="profile-phone" style="font-weight: 600; font-size: 14px; margin-top: 2px; color: #1d1d1f;">Not provided</div>
    </div>

    <!-- Driver Vehicle & Documents (drivers only) -->
    <div id="driver-docs" class="tricycle-preview-box" style="display: none; text-align: left;">
      <div style="font-size: 14px; color: #214329; font-weight: 700; margin-bottom: 8px;">Driver Details</div>
      <div id="driver-docs-body" class="drv-details"></div>
    </div>

    <!-- Account ID Box -->
    <div class="info-box">
      <div style="font-size: 12px; color: #888;">Account ID</div>
      <div id="profile-id" style="font-weight: 700; letter-spacing: 1px; font-size: 15px; margin-top: 2px;">--</div>
    </div>

    <!-- Driver Tricycle Section -->
    <div id="driver-tricycle-container" class="tricycle-preview-box" style="display: none;">
      <div style="font-size: 12px; color: #888; font-weight: 600; text-align: left; margin-bottom: 4px;">Tricycle Vehicle</div>
      <img id="tricycle-img-preview" class="tricycle-img" src="" alt="Tricycle Picture">
    </div>

    <!-- Reviews Section (Visible for drivers or users with feedback) -->
    <div id="reviews-section" class="tricycle-preview-box" style="display: none; margin-top: 20px;">
      <div style="font-size: 14px; color: #214329; font-weight: 700; text-align: left; margin-bottom: 8px;">Reviews</div>
      <div id="reviews-list" style="display: flex; flex-direction: column; gap: 8px;">
        <!-- Dynamic reviews injected here -->
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="notify.js"></script>
  <script src="driver-info.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetUserId = urlParams.get('id');
      const returnUrl = urlParams.get('return');

      const backBtn = document.getElementById('back-btn');
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (returnUrl) {
          window.location.href = decodeURIComponent(returnUrl);
        } else {
          window.history.back();
        }
      });

      if (!targetUserId) {
        document.getElementById('profile-name').textContent = "User not found";
        return;
      }

      const { data: profile, error } = await _supabase
        .from('profiles')
        .select('*')
        .eq('id', targetUserId)
        .maybeSingle();

      if (error || !profile) {
        document.getElementById('profile-name').textContent = "Profile unavailable";
        return;
      }

      const name = profile.fullname || 'User';
      const role = profile.role || 'passenger';
      const avatarUrl = profile.avatar_url;
      const phone = profile.phone;
      const tricycleUrl = profile.tricycle_url;

      document.getElementById('profile-name').textContent = name;
      document.getElementById('profile-role').textContent = role;
      document.getElementById('profile-id').textContent = TriUtil.shortId(profile.id);

      // Populate Phone Number
      const phoneEl = document.getElementById('profile-phone');
      if (phone && phone.trim() !== "") {
        phoneEl.textContent = phone;
      } else {
        phoneEl.textContent = "Not provided";
        phoneEl.style.color = "#888";
      }

      // Populate Avatar
      const avatarContainer = document.getElementById('avatar-container');
      if (avatarUrl) {
        avatarContainer.innerHTML = `<img src="${avatarUrl}" alt="" style="width:100%; height:100%; object-fit:cover;">`;
      } else {
        avatarContainer.textContent = name.charAt(0).toUpperCase();
      }

      // Driver details: plate, body number, operator's permit, rehistro
      if (role === 'driver') {
        const details = await TriDriver.getDetails(targetUserId, {});
        TriDriver.render(document.getElementById('driver-docs-body'), details, { showRehistro: true, photo: false, contact: false });
        const docsBody = document.getElementById('driver-docs-body');
        const docPhotos = [['Operator\'s Permit', profile.operator_permit_url], ['Rehistro (OR/CR)', profile.rehistro_url]]
          .filter(([, url]) => url)
          .map(([label, url]) => `<div><div class="fine-print" style="margin-top:6px;">${TriUtil.esc(label)}</div><img class="doc-thumb" src="${TriUtil.esc(url)}" alt="${TriUtil.esc(label)}"></div>`)
          .join('');
        if (docPhotos) docsBody.insertAdjacentHTML('beforeend', docPhotos);
        document.getElementById('driver-docs').style.display = 'block';
      }

      // Show Tricycle Photo if user is a driver and has uploaded one
      if (role === 'driver' && tricycleUrl) {
        const triContainer = document.getElementById('driver-tricycle-container');
        const triImg = document.getElementById('tricycle-img-preview');
        triImg.src = tricycleUrl;
        triContainer.style.display = 'block';
      }

      // Fetch and display reviews without relying on foreign key constraints
      if (role === 'driver') {
        const { data: ridesWithReviews, error: reviewError } = await _supabase
          .from('rides')
          .select('*')
          .eq('driver_id', targetUserId)
          .not('rating', 'is', null);

        const reviewsSection = document.getElementById('reviews-section');
        const reviewsList = document.getElementById('reviews-list');

        if (ridesWithReviews && ridesWithReviews.length > 0) {
          reviewsSection.style.display = 'block';
          
          // Loop through reviews and fetch passenger profile separately if passenger_id exists
          const reviewHtmlPromises = ridesWithReviews.map(async (ride) => {
            const stars = '★'.repeat(ride.rating || 0) + '☆'.repeat(5 - (ride.rating || 0));
            
            let pName = ride.passenger_name || 'Passenger';
            let pAvatar = ride.passenger_avatar_url || null;

            // If we have a passenger_id but no name stored directly, fetch it from profiles
            if (ride.passenger_id && !ride.passenger_name) {
              const { data: pProfile } = await _supabase
                .from('profiles')
                .select('fullname, avatar_url')
                .eq('id', ride.passenger_id)
                .maybeSingle();
              
              if (pProfile) {
                pName = pProfile.fullname || 'Passenger';
                pAvatar = pProfile.avatar_url;
              }
            }

            let avatarHtml = '';
            if (pAvatar) {
              avatarHtml = `<img src="${pAvatar}" alt="${pName}" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">`;
            } else {
              const initial = pName.charAt(0).toUpperCase();
              avatarHtml = `<div style="width: 28px; height: 28px; border-radius: 50%; background: #ccc; color: #555; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">${initial}</div>`;
            }

            return `
              <div class="review-item">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                  ${avatarHtml}
                  <div style="font-weight: 700; font-size: 13px; color: #1d1d1f;">${TriUtil.esc(pName)}</div>
                </div>
                <div class="review-stars">${stars}</div>
                <div style="color: #333; font-size: 12px;">${TriUtil.esc(ride.feedback || 'No comment provided.')}</div>
              </div>
            `;
          });

          const renderedReviews = await Promise.all(reviewHtmlPromises);
          reviewsList.innerHTML = renderedReviews.join('');
        } else {
          reviewsSection.style.display = 'block';
          reviewsList.innerHTML = `<div style="font-size: 12px; color: #888; text-align: left;">No reviews yet.</div>`;
        }
      }
    });
  </script>
</body>
</html>
