<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriHatid - Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <style>
    :root {
      --green: #214329;
      --green-2: #2f5a38;
      --sun: #f2b632;
      --canvas: #f1f5f2;
      --ink: #17231a;
      --muted: #5f6e63;
      --line: #dde5df;
      --white: #ffffff;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .hidden {
      display: none !important;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(23, 35, 26, 0.08);
    }

    .login-banner {
      background: var(--green);
      color: var(--white);
      padding: 24px;
    }

    .login-banner h1 {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.2;
    }

    .login-banner p {
      font-size: 12px;
      color: rgba(255, 253, 240, 0.8);
      margin-top: 2px;
    }

    .login-form {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-form h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .login-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: -8px;
    }

    .login-error {
      background: var(--danger-soft);
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .text-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: #f9fbf9;
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    .text-input:focus {
      background: var(--white);
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(242, 182, 50, 0.3);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap .text-input {
      padding-right: 42px;
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
    }

    .primary-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: none;
      background: var(--green);
      color: var(--white);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    .primary-btn:hover {
      background: var(--green-2);
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-banner">
      <div>
        <h1>TriHatid Admin</h1>
        <p>Admin Portal • Aklan</p>
      </div>
    </div>

    <form id="admin-login-form" class="login-form" autocomplete="off">
      <h2>Sign in to Admin Portal</h2>
      <p class="login-sub">Enter your admin email and password.</p>

      <div id="admin-login-error" class="login-error hidden"></div>

      <div>
        <label for="admin-email" class="field-label">Email</label>
        <input
          type="email"
          id="admin-email"
          name="admin_login_email"
          class="text-input"
          required
          autocomplete="off"
        />
      </div>

      <div>
        <label for="admin-password" class="field-label">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="admin-password"
            name="admin_login_pass"
            class="text-input"
            required
            autocomplete="new-password"
          />
          <button
            type="button"
            class="eye-btn"
            onclick="toggleAdminPassword()"
            aria-label="Toggle password visibility"
          >
            <i id="admin-eye-icon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="admin-login-btn" class="primary-btn">Sign In</button>
    </form>
  </div>

  <script>
    function isAllowedAdmin(user) {
      const role = (user?.user_metadata?.role || user?.app_metadata?.role || '').toLowerCase();
      return role === 'admin' || user?.email === 'admin@trihatid.ph';
    }

    function toggleAdminPassword() {
      const input = document.getElementById('admin-password');
      const icon = document.getElementById('admin-eye-icon');
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      icon.className = isPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    }

    function clearLoginInputs() {
      const emailEl = document.getElementById('admin-email');
      const passEl = document.getElementById('admin-password');
      if (emailEl) emailEl.value = '';
      if (passEl) passEl.value = '';
    }

    async function initLoginPage() {
      clearLoginInputs();
      if (window._supabase && _supabase.auth) {
        await _supabase.auth.signOut();
      }
      setTimeout(clearLoginInputs, 120);
    }

    document.addEventListener('DOMContentLoaded', initLoginPage);
    window.addEventListener('pageshow', clearLoginInputs);

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errBox = document.getElementById('admin-login-error');
      const btn = document.getElementById('admin-login-btn');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        if (!window._supabase || !_supabase.auth) {
          throw new Error('Authentication client is not available.');
        }

        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
          errBox.textContent = error.message || 'Invalid admin email or password.';
          errBox.classList.remove('hidden');
          return;
        }

        if (!isAllowedAdmin(data.user)) {
          await _supabase.auth.signOut();
          errBox.textContent = 'This account does not have admin access.';
          errBox.classList.remove('hidden');
          return;
        }

        window.location.replace('admin.html');
      } catch (err) {
        errBox.textContent = err.message || 'Unable to sign in.';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
